<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مصنع التطبيقات</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--txt:#eef1f6;--mut:#8b93a3;--acc:#7c5cff;--acc2:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc)}
button.danger{color:#ff6b6b}
nav{display:flex;gap:8px;padding:8px 16px}
nav button{flex:1}
nav button.on{background:var(--acc);border-color:var(--acc)}
main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow-y:auto;padding:12px 16px}
.view.on{display:block}
#chat.on{display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto}
.b{max-width:92%;margin:8px 0;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.7;word-break:break-word}
.b.u{background:var(--acc);margin-inline-start:auto;border-end-end-radius:4px}
.b.a{background:var(--card);border:1px solid var(--line);border-end-start-radius:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;height:48px;max-height:120px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.app{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.app h3{margin:0 0 4px;font-size:16px}.app small{color:var(--mut)}
.empty{color:var(--mut);text-align:center;margin-top:40px;line-height:1.9}
#run{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#run.on{display:flex}
#run iframe{flex:1;border:0;width:100%;background:#fff}
#run .top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card)}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:16px;width:min(92vw,420px);padding:18px}
dialog::backdrop{background:#000a}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
input{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;direction:ltr;text-align:left}
a{color:var(--acc2)}
</style>
</head>
<body>
<header><h1>🏭 مصنع التطبيقات</h1><button id="setBtn">⚙️ الإعدادات</button></header>
<nav><button id="tChat" class="on">💬 الدردشة</button><button id="tApps">📱 تطبيقاتي (<span id="cnt">0</span>)</button></nav>
<main>
  <section id="chat" class="view on">
    <div id="msgs"></div>
    <div class="bar"><textarea id="inp" placeholder="اكتب: اصنع لي تطبيق حاسبة..."></textarea><button class="pri" id="send">إرسال</button></div>
  </section>
  <section id="apps" class="view"></section>
</main>

<div id="run"><div class="top"><b id="runName"></b><button id="runClose">✕ إغلاق</button></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>

<dialog id="dlg">
  <h3 style="margin-top:0">الإعدادات</h3>
  <label>مفتاح Gemini المجاني (من <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>)</label>
  <input id="key" type="password" placeholder="AIza...">
  <label>اسم النموذج</label>
  <input id="model" list="mlist" placeholder="gemini-3.8-flash">
  <datalist id="mlist"></datalist>
  <div class="row"><button id="loadModels">🔄 تحديث قائمة النماذج</button><small id="mstat" style="color:var(--mut);align-self:center"></small></div>
  <label>اسم المالك (يُختم داخل كل تطبيق)</label>
  <input id="owner" placeholder="Mohammad" style="direction:rtl;text-align:right">
  <div class="row" style="margin-top:16px"><button class="pri" id="saveCfg">حفظ</button><button id="closeCfg">إغلاق</button><button class="danger" id="newChat">محادثة جديدة</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=Object.assign({key:'',model:'gemini-3.8-flash',owner:'Mohammad',models:[]},ld('cfg',{}));
const API='https://generativelanguage.googleapis.com/v1beta/';
function fillList(){const dl=$('#mlist');dl.innerHTML='';(cfg.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m;dl.appendChild(o)})}
async function loadModels(){
  if(!cfg.key){$('#mstat').textContent='ضع المفتاح أولاً';return}
  $('#mstat').textContent='...';
  try{
    const r=await fetch(API+'models?pageSize=200',{headers:{'x-goog-api-key':cfg.key}});
    const d=await r.json();
    if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);
    cfg.models=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/i.test(m.name)&&!/image|tts|live|audio|thinking-exp|embedding/i.test(m.name)).map(m=>m.name.replace('models/','')).sort().reverse();
    sv('cfg',cfg);fillList();$('#mstat').textContent='✓ '+cfg.models.length+' نموذج';
  }catch(e){$('#mstat').textContent='تعذّر التحديث'}
}
async function gen(model){
  const res=await fetch(API+'models/'+encodeURIComponent(model)+':generateContent',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents:hist,generationConfig:{maxOutputTokens:30000}})
  });
  let data={};try{data=await res.json()}catch(e){}
  return {res,data};
}
let apps=ld('apps',[]);
let hist=[];
let busy=false;

const SYSTEM=`You are an expert builder of mobile apps delivered as a single self-contained HTML file. The user speaks Arabic; reply in Arabic.
When the user asks for an app: write one short Arabic sentence, then ONE complete HTML file inside a single \`\`\`html code block.
Rules for every app: mobile-first and touch friendly, full screen, Arabic RTL interface unless asked otherwise, modern dark design, viewport meta tag, a <title> with the app name, all CSS and JS inline, no external libraries or network resources unless the user asks for them.
The app runs inside a sandboxed iframe where localStorage may be blocked: wrap every storage call in try/catch and fall back to in-memory variables.
When the user asks for a change, return the full updated file, never a partial snippet.
If the user is only chatting or asking a question, answer briefly without code.`;

function stamp(html){
  const y=new Date().getFullYear(), o=cfg.owner||'Owner';
  const note=`<!-- © ${y} ${o}. All rights reserved. -->`;
  if(!/<!doctype/i.test(html))html='<!doctype html>\n'+html;
  html=html.replace(/<!doctype[^>]*>/i,m=>m+'\n'+note);
  const meta=`<meta name="author" content="${o}"><meta name="copyright" content="© ${y} ${o}">`;
  html=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+meta):html;
  const foot=`<div style="text-align:center;font:11px system-ui;opacity:.5;padding:8px">© ${y} ${o}</div>`;
  html=/<\/body>/i.test(html)?html.replace(/<\/body>/i,foot+'</body>'):html+foot;
  return html;
}
function titleOf(html){const m=html.match(/<title>([^<]*)<\/title>/i);return (m&&m[1].trim())||'تطبيق بدون اسم'}

function bubble(text,cls){
  const d=document.createElement('div');d.className='b '+cls;d.textContent=text;
  $('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;return d;
}
function runApp(html,name){
  $('#runName').textContent=name;$('#frame').srcdoc=html;$('#run').classList.add('on');
}
function download(html,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=(name||'app').replace(/[^\w\u0600-\u06FF-]+/g,'_')+'.html';
  document.body.appendChild(a);a.click();a.remove();
}
function saveApp(html){
  const name=titleOf(html);
  apps.unshift({id:Date.now(),name,html,date:new Date().toLocaleDateString('ar')});
  sv('apps',apps);renderApps();return name;
}
function addActions(el,html){
  const r=document.createElement('div');r.className='row';
  const mk=(t,c,f)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;r.appendChild(b)};
  mk('▶ تشغيل','pri',()=>runApp(html,titleOf(html)));
  mk('💾 حفظ',0,function(){saveApp(html);this.textContent='✓ تم الحفظ';this.disabled=true});
  mk('⬇ تنزيل',0,()=>download(html,titleOf(html)));
  el.appendChild(r);
}
function renderApps(){
  $('#cnt').textContent=apps.length;
  const box=$('#apps');box.innerHTML='';
  if(!apps.length){box.innerHTML='<div class="empty">لا توجد تطبيقات بعد.<br>اطلب من الدردشة أن تصنع لك تطبيقاً ثم اضغط «حفظ».</div>';return}
  apps.forEach(a=>{
    const d=document.createElement('div');d.className='app';
    d.innerHTML='<h3></h3><small></small><div class="row"></div>';
    d.querySelector('h3').textContent=a.name;d.querySelector('small').textContent=a.date;
    const r=d.querySelector('.row');
    const mk=(t,c,f)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;r.appendChild(b)};
    mk('▶ تشغيل','pri',()=>runApp(a.html,a.name));
    mk('⬇ تنزيل',0,()=>download(a.html,a.name));
    mk('🗑 حذف','danger',()=>{if(confirm('حذف «'+a.name+'»؟')){apps=apps.filter(x=>x.id!==a.id);sv('apps',apps);renderApps()}});
    box.appendChild(d);
  });
}

async function send(){
  const text=$('#inp').value.trim();
  if(!text||busy)return;
  if(!cfg.key){$('#dlg').showModal();return}
  busy=true;$('#send').disabled=true;$('#inp').value='';
  bubble(text,'u');
  hist.push({role:'user',parts:[{text}]});
  const wait=bubble('⏳ جارٍ الصنع...','a');
  try{
    let model=cfg.model,r,tries=0;
    const alts=(cfg.models||[]).filter(m=>m!==cfg.model);
    while(true){
      r=await gen(model);
      if(r.res.ok||![429,500,503,504].includes(r.res.status))break;
      tries++;
      if(tries>=4)break;
      let msg='⏳ الخادم مزدحم، إعادة المحاولة ('+tries+')...';
      if(tries===2&&alts.length){model=alts[0];msg+='\nبنموذج بديل: '+model}
      wait.textContent=msg;
      await new Promise(s=>setTimeout(s,3000*tries));
    }
    const res=r.res,data=r.data;
    if(!res.ok){
      const m=(data.error&&data.error.message)||('خطأ '+res.status);
      wait.textContent=res.status===429?'⚠️ وصلت لحد الاستخدام المجاني. انتظر دقيقة وحاول مجدداً.':'⚠️ '+m;
      hist.pop();
    }else{
      const out=((data.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      hist.push({role:'model',parts:[{text:out}]});
      const m=out.match(/```html\s*([\s\S]*?)```/)||out.match(/```html\s*([\s\S]*)$/);
      if(m){
        const html=stamp(m[1].trim());
        wait.textContent=(out.replace(/```html[\s\S]*$/,'').trim()||'جاهز ✅');
        addActions(wait,html);
      }else wait.textContent=out||'(رد فارغ)';
    }
  }catch(e){wait.textContent='⚠️ تعذّر الاتصال. تحقق من الإنترنت.';hist.pop()}
  busy=false;$('#send').disabled=false;$('#msgs').scrollTop=1e9;
}

$('#send').onclick=send;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
$('#tChat').onclick=()=>{$('#chat').classList.add('on');$('#apps').classList.remove('on');$('#tChat').classList.add('on');$('#tApps').classList.remove('on')};
$('#tApps').onclick=()=>{$('#apps').classList.add('on');$('#chat').classList.remove('on');$('#tApps').classList.add('on');$('#tChat').classList.remove('on')};
$('#runClose').onclick=()=>{$('#run').classList.remove('on');$('#frame').srcdoc=''};
$('#setBtn').onclick=()=>{$('#key').value=cfg.key;$('#model').value=cfg.model;$('#owner').value=cfg.owner;$('#dlg').showModal()};
$('#closeCfg').onclick=()=>$('#dlg').close();
$('#saveCfg').onclick=()=>{const hadKey=cfg.key;cfg={key:$('#key').value.trim(),model:$('#model').value.trim()||'gemini-3.8-flash',owner:$('#owner').value.trim()||'Mohammad',models:cfg.models||[]};sv('cfg',cfg);$('#dlg').close();if(cfg.key&&(!hadKey||!cfg.models.length))loadModels()};
$('#loadModels').onclick=()=>{cfg.key=$('#key').value.trim()||cfg.key;loadModels()};
fillList();if(cfg.key&&!(cfg.models||[]).length)loadModels();
$('#newChat').onclick=()=>{hist=[];$('#msgs').innerHTML='';welcome();$('#dlg').close()};

function welcome(){bubble('أهلاً محمد 👋\nأنا مصنع التطبيقات. صف لي أي تطبيق وسأبنيه لك، ثم احفظه أو شغّله أو نزّله.\n\nمثال: «اصنع لي تطبيق قائمة مهام بتصميم بنفسجي».'+(cfg.key?'':'\n\nأولاً: اضغط ⚙️ وضع مفتاح Gemini المجاني.'),'a')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
welcome();renderApps();
</script>
</body>
</html>
