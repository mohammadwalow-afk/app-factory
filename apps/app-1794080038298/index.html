<html lang="ar" dir="rtl">
<head><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="author" content="Mohammad"><meta name="copyright" content="© 2026 Mohammad">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>حاسبة Mohammad Walow العلمية المتطورة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
        }

        body {
            background: linear-gradient(135deg, #090d16, #111827, #261033);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
            padding: 8px;
        }

        .calculator-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 35px;
            padding: 18px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: env(safe-area-inset-bottom, 5px);
        }

        .watermark {
            text-align: center;
            font-size: 0.8rem;
            color: #c084fc;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.6);
            margin-bottom: -4px;
            direction: ltr;
        }

        .display {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 22px;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            direction: ltr;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .history {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            min-height: 18px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .current {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
            overflow-x: auto;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            direction: ltr;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px; /* شكل بيضوي ناعم */
            height: 48px;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: scale(0.93);
        }

        /* Glass Glow Effect on Click */
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            pointer-events: none;
        }

        .btn.glow::after {
            transform: translate(-50%, -50%) scale(2.5);
            opacity: 1;
            transition: 0s;
        }

        /* Color Coding & Dynamic Lighting */
        .btn.number {
            background: rgba(255, 255, 255, 0.06);
        }
        .btn.number.glow-active {
            box-shadow: 0 0 18px #38bdf8, inset 0 0 10px rgba(56, 189, 248, 0.6);
            border-color: #38bdf8;
        }

        .btn.operator {
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
        }
        .btn.operator.glow-active {
            box-shadow: 0 0 18px #6366f1, inset 0 0 10px rgba(99, 102, 241, 0.6);
            border-color: #6366f1;
        }

        .btn.scientific {
            background: rgba(236, 72, 153, 0.1);
            color: #f472b6;
            font-size: 0.85rem;
        }
        .btn.scientific.glow-active {
            box-shadow: 0 0 18px #ec4899, inset 0 0 10px rgba(236, 72, 153, 0.6);
            border-color: #ec4899;
        }

        .btn.action {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
        }
        .btn.action.glow-active {
            box-shadow: 0 0 18px #ef4444, inset 0 0 10px rgba(239, 68, 68, 0.6);
            border-color: #ef4444;
        }

        .btn.equals {
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
            grid-column: span 2;
            width: 100%;
            border-radius: 28px;
        }
        .btn.equals.glow-active {
            box-shadow: 0 0 22px #22c55e, inset 0 0 15px rgba(34, 197, 94, 0.7);
            border-color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="watermark">mohammad walow</div>
        
        <div class="display">
            <div class="history" id="history"></div>
            <div class="current" id="current">0</div>
        </div>

        <div class="keypad">
            <!-- Row 1: Advanced Scientific -->
            <button class="btn scientific" onclick="appendFunc('sin(')">sin</button>
            <button class="btn scientific" onclick="appendFunc('cos(')">cos</button>
            <button class="btn scientific" onclick="appendFunc('tan(')">tan</button>
            <button class="btn action" onclick="clearAll()">AC</button>

            <!-- Row 2: Advanced Scientific -->
            <button class="btn scientific" onclick="appendFunc('asin(')">sin⁻¹</button>
            <button class="btn scientific" onclick="appendFunc('acos(')">cos⁻¹</button>
            <button class="btn scientific" onclick="appendFunc('atan(')">tan⁻¹</button>
            <button class="btn action" onclick="deleteChar()">⌫</button>

            <!-- Row 3: Powers & Roots -->
            <button class="btn scientific" onclick="appendFunc('sqrt(')">√</button>
            <button class="btn scientific" onclick="appendFunc('cbrt(')">∛</button>
            <button class="btn value" onclick="appendValue('^')">xʸ</button>
            <button class="btn scientific" onclick="appendValue('**2')">x²</button>

            <!-- Row 4: Logarithms & Constants -->
            <button class="btn scientific" onclick="appendFunc('log(')">log₁₀</button>
            <button class="btn scientific" onclick="appendFunc('ln(')">ln</button>
            <button class="btn scientific" onclick="appendValue('Math.E')">e</button>
            <button class="btn scientific" onclick="appendValue('Math.PI')">π</button>

            <!-- Row 5: Brackets & Operators -->
            <button class="btn scientific" onclick="appendValue('(')">(</button>
            <button class="btn scientific" onclick="appendValue(')')">)</button>
            <button class="btn scientific" onclick="appendFunc('factorial(')">n!</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>

            <!-- Row 6 -->
            <button class="btn number" onclick="appendValue('7')">7</button>
            <button class="btn number" onclick="appendValue('8')">8</button>
            <button class="btn number" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>

            <!-- Row 7 -->
            <button class="btn number" onclick="appendValue('4')">4</button>
            <button class="btn number" onclick="appendValue('5')">5</button>
            <button class="btn number" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>

            <!-- Row 8 -->
            <button class="btn number" onclick="appendValue('1')">1</button>
            <button class="btn number" onclick="appendValue('2')">2</button>
            <button class="btn number" onclick="appendValue('3')">3</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <!-- Row 9 -->
            <button class="btn number" onclick="appendValue('0')">0</button>
            <button class="btn number" onclick="appendValue('.')">.</button>
            <button class="btn equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const currentEl = document.getElementById('current');
        const historyEl = document.getElementById('history');
        let currentInput = '0';
        let historyExpression = '';

        // Touch/Click light glow effect
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', () => {
                button.classList.add('glow', 'glow-active');
                setTimeout(() => {
                    button.classList.remove('glow', 'glow-active');
                }, 300);
            });
        });

        function updateDisplay() {
            currentEl.textContent = currentInput;
            historyEl.textContent = historyExpression;
        }

        function appendValue(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function appendFunc(func) {
            if (currentInput === '0') {
                currentInput = func;
            } else {
                currentInput += func;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            historyExpression = '';
            updateDisplay();
        }

        function deleteChar() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        function calculate() {
            try {
                historyExpression = currentInput;
                let parseStr = currentInput
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/\^/g, '**')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/cbrt\(/g, 'Math.cbrt(')
                    .replace(/sin\(/g, 'Math.sin((Math.PI/180)*')
                    .replace(/cos\(/g, 'Math.cos((Math.PI/180)*')
                    .replace(/tan\(/g, 'Math.tan((Math.PI/180)*')
                    .replace(/asin\(/g, '(180/Math.PI)*Math.asin(')
                    .replace(/acos\(/g, '(180/Math.PI)*Math.acos(')
                    .replace(/atan\(/g, '(180/Math.PI)*Math.atan(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/factorial\(/g, 'factorial(');

                let result = eval(parseStr);
                
                if (!Number.isInteger(result) && !isNaN(result)) {
                    result = parseFloat(result.toFixed(8));
                }

                currentInput = result.toString();
                updateDisplay();
            } catch (error) {
                currentInput = 'خطأ';
                updateDisplay();
                setTimeout(() => {
                    currentInput = '0';
                    updateDisplay();
                }, 1200);
            }
        }
    </script>
