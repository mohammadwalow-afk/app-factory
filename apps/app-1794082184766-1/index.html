<html lang="ar" dir="rtl">
<head><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="author" content="Mohammad"><meta name="copyright" content="© 2026 Mohammad">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الكاميرا الحرارية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 16px;
            background: rgba(17, 24, 39, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        .viewfinder {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas, .snapshot-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* تصفية الألوان الحرارية */
        .thermal-ironbow {
            filter: hue-rotate(180deg) saturate(350%) contrast(150%);
            mix-blend-mode: color;
        }
        
        .thermal-rainbow {
            filter: hue-rotate(90deg) saturate(400%) contrast(180%) invert(15%);
            mix-blend-mode: overlay;
        }

        .thermal-fire {
            filter: sepia(100%) hue-rotate(-50deg) saturate(500%) contrast(200%);
            mix-blend-mode: color-burn;
        }

        .thermal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            mix-blend-mode: overlay;
            opacity: 0.85;
            transition: background 0.3s;
        }

        /* شبكة التصويب */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crosshair::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
        }

        /* مؤشر الحرارة التخيلي */
        .temp-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 2px;
            direction: ltr;
        }
        .temp-val {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ef4444;
        }
        .temp-label {
            font-size: 0.7rem;
            color: #9ca3af;
            text-align: right;
            direction: rtl;
        }

        /* شريط التدرج اللوني */
        .palette-bar {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 150px;
            border-radius: 7px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .palette-segment { flex: 1; width: 100%; }

        /* لوحة التحكم */
        .controls {
            padding: 16px;
            background: rgba(17, 24, 39, 0.95);
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .palettes-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn-palette {
            background: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-palette.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        .actions-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-main {
            flex: 1;
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            cursor: pointer;
        }
        .btn-main:active {
            transform: scale(0.97);
        }

        .btn-sec {
            background: #374151;
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* معرض التثبيت على الشاشة */
        .gallery-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .gallery-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .gallery-item {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 8px;
            overflow: hidden;
            background: #1f2937;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .close-modal {
            background: #374151;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* شاشة الخطأ / الكاميرا غير متوفرة */
        .error-msg {
            position: absolute;
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>محاكي الكاميرا الحرارية</h1>
        <button class="btn-sec" onclick="openGallery()" style="padding: 6px 12px; font-size: 0.8rem;">المثبتة (<span id="count">0</span>)</button>
    </header>

    <div class="viewfinder" id="viewfinder">
        <div class="error-msg" id="errorMsg">جاري تشغيل الكاميرا... يرجى السماح بالوصول للكاميرا</div>
        <video id="video" autoplay playsinline muted></video>
        <div id="thermalOverlay" class="thermal-overlay thermal-ironbow"></div>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div class="crosshair"></div>

        <div class="temp-badge">
            <span class="temp-label">نقطة القياس المركزية</span>
            <span class="temp-val" id="tempValue">36.5 °C</span>
        </div>

        <div class="palette-bar" id="paletteBar">
            <div class="palette-segment" style="background: #ffffff;"></div>
            <div class="palette-segment" style="background: #eab308;"></div>
            <div class="palette-segment" style="background: #ef4444;"></div>
            <div class="palette-segment" style="background: #a855f7;"></div>
            <div class="palette-segment" style="background: #3b82f6;"></div>
            <div class="palette-segment" style="background: #000000;"></div>
        </div>
    </div>

    <div class="controls">
        <div class="palettes-row">
            <button class="btn-palette active" onclick="setPalette('ironbow', this)">حديد حراري</button>
            <button class="btn-palette" onclick="setPalette('rainbow', this)">قوس قزح</button>
            <button class="btn-palette" onclick="setPalette('fire', this)">نار ملتهبة</button>
        </div>
        <div class="actions-row">
            <button class="btn-sec" onclick="toggleCamera()">🔄 قلب الكاميرا</button>
            <button class="btn-main" onclick="freezeAndSave()">📌 تثبيت على الشاشة</button>
        </div>
    </div>

    <!-- نافذة اللقطات المثبتة -->
    <div class="gallery-modal" id="galleryModal">
        <div class="gallery-header">
            <h2 style="font-size: 1.1rem; color: #38bdf8;">اللقطات المثبتة</h2>
            <button class="close-modal" onclick="closeGallery()">إغلاق</button>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const thermalOverlay = document.getElementById('thermalOverlay');
        const errorMsg = document.getElementById('errorMsg');
        const tempValue = document.getElementById('tempValue');
        const galleryModal = document.getElementById('galleryModal');
        const galleryGrid = document.getElementById('galleryGrid');
        const countSpan = document.getElementById('count');

        let currentFacingMode = 'environment';
        let currentStream = null;
        let savedSnapshots = [];

        // تخزين محلي آمن
        try {
            const localData = localStorage.getItem('thermal_snapshots');
            if (localData) {
                savedSnapshots = JSON.parse(localData);
                updateCount();
            }
        } catch (e) {
            savedSnapshots = [];
        }

        // بدء تشغيل الكاميرا
        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                errorMsg.style.display = 'none';
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'تعذر الوصول للكاميرا. يرجى التأكد من منح الصلاحيات.';
            }
        }

        function toggleCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        function setPalette(type, btn) {
            document.querySelectorAll('.btn-palette').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            thermalOverlay.className = 'thermal-overlay';
            if (type === 'ironbow') {
                thermalOverlay.classList.add('thermal-ironbow');
            } else if (type === 'rainbow') {
                thermalOverlay.classList.add('thermal-rainbow');
            } else if (type === 'fire') {
                thermalOverlay.classList.add('thermal-fire');
            }
        }

        // محاكاة تقلبات درجة الحرارة الواقعية
        setInterval(() => {
            let baseTemp = 36.2;
            let randomVar = (Math.random() * 1.5).toFixed(1);
            tempValue.innerText = (baseTemp + parseFloat(randomVar)) + ' °C';
        }, 1200);

        // تثبيت الصورة على الشاشة والتقاطها
        function freezeAndSave() {
            if (!video.srcObject) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            
            // رسم إطار الفيديو
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // دمج الفلتر الحراري تقريبياً على الكانفاس
            ctx.fillStyle = thermalOverlay.style.mixBlendMode || 'rgba(255, 50, 0, 0.35)';
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            
            savedSnapshots.unshift(dataUrl);
            if (savedSnapshots.length > 20) savedSnapshots.pop();

            try {
                localStorage.setItem('thermal_snapshots', JSON.stringify(savedSnapshots));
            } catch (e) {}

            updateCount();
            
            // تأثير بصري للتثبيت
            document.body.style.filter = 'brightness(1.5)';
            setTimeout(() => document.body.style.filter = 'none', 100);
            
            openGallery();
        }

        function updateCount() {
            countSpan.innerText = savedSnapshots.length;
        }

        function openGallery() {
            galleryGrid.innerHTML = '';
            if (savedSnapshots.length === 0) {
                galleryGrid.innerHTML = '<div style="color:#6b7280; grid-column:span 2; text-align:center; padding:40px;">لا توجد لقطات مثبتة بعد</div>';
            } else {
                savedSnapshots.forEach((src, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `<img src="${src}" alt="Thermal Snapshot">`;
                    galleryGrid.appendChild(item);
                });
            }
            galleryModal.style.display = 'flex';
        }

        function closeGallery() {
            galleryModal.style.display = 'none';
        }

        // التشغيل الأولي
        startCamera();
    </script>
