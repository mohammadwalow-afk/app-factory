<html lang="ar" dir="rtl">
<head><meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="author" content="Mohammad"><meta name="copyright" content="© 2026 Mohammad">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>استوديو الفيديو</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --panel-bg: #1a1c23;
            --accent: #e50914;
            --accent-hover: #f40612;
            --text-main: #f0f0f3;
            --text-muted: #9aa0a6;
            --border: #2d303b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            flex: 1;
            padding: 16px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        textarea, input[type="password"] {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        textarea:focus, input[type="password"]:focus {
            border-color: var(--accent);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: var(--bg-color);
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--accent);
        }

        .upload-area input {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: none;
            position: relative;
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .preview-container img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
        }

        .remove-img {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #2d303b;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #3b3f4d;
        }

        .output-box {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #4ade80;
            white-space: pre-wrap;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-content {
            direction: ltr;
            text-align: left;
            color: #4ade80;
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
            max-height: 60px;
            overflow-y: auto;
        }

        .history-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .small-btn {
            background: #2d303b;
            color: var(--text-main);
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .small-btn.danger {
            background: rgba(229, 9, 20, 0.2);
            color: #ff5252;
        }

        .error-msg {
            color: #ff5252;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.3);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .icon-btn:hover { color: var(--text-main); }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <span>استوديو الفيديو</span>
        <button class="icon-btn" id="toggleSettings" title="الإعدادات">⚙️</button>
    </header>

    <div class="container">
        <!-- إعدادات مفتاح API -->
        <div class="card" id="settingsCard" style="display:none;">
            <div class="card-title">إعدادات مفتاح Gemini API</div>
            <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Gemini API هنا...">
            <button class="btn" id="saveKeyBtn">حفظ المفتاح</button>
        </div>

        <!-- قسم الإدخال -->
        <div class="card">
            <div class="card-title">وصف المشهد (بالعربية)</div>
            <textarea id="sceneInput" placeholder="اكتب وصفاً مبدئياً لمشهدك هنا..."></textarea>
            
            <div class="card-title">صورة مرجعية للمشهد</div>
            <div class="upload-area" id="dropZone">
                <input type="file" id="imageInput" accept="image/*">
                <div id="uploadText">اضغط أو اسحب صورة لإرفاقها</div>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="" alt="معاينة الصورة">
                <button class="remove-img" id="removeImgBtn">×</button>
            </div>

            <button class="btn" id="enhanceBtn">
                <span>حسّن الوصف بواسطة Gemini</span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <!-- قسم النتيجة والتحسين -->
        <div class="card" id="outputCard" style="display:none;">
            <div class="card-title">الوصف السينمائي (English)</div>
            <div class="output-box" id="outputBox"></div>
            <div class="action-grid">
                <button class="btn btn-secondary" id="copyBtn">نسخ الوصف</button>
                <button class="btn" id="saveHistoryBtn">حفظ في السجل</button>
            </div>
        </div>

        <!-- أزرار أدوات الفيديو الخارجية -->
        <div class="card">
            <div class="card-title">أدوات صناعة الفيديو الذكية</div>
            <div class="tools-grid">
                <button class="btn btn-secondary" onclick="window.open('https://www.canva.com', '_blank')">Canva</button>
                <button class="btn btn-secondary" onclick="window.open('https://runwayml.com', '_blank')">Runway</button>
                <button class="btn btn-secondary" onclick="window.open('https://deepmind.google/technologies/veo/', '_blank')">Veo</button>
                <button class="btn btn-secondary" onclick="window.open('https://higgsfield.ai', '_blank')">Higgsfield</button>
            </div>
        </div>

        <!-- قسم المحفوظات (أسفل الصفحة) -->
        <div class="card">
            <div class="card-title">سجل الأوصاف المحفوظة</div>
            <div class="history-list" id="historyList">
                <div style="color: var(--text-muted); text-align: center; font-size: 0.85rem; padding: 10px;">لا توجد محفوظات بعد</div>
            </div>
        </div>
    </div>

    <script>
        let historyData = [];
        let apiKey = '';

        try {
            const saved = localStorage.getItem('video_studio_history_v3');
            if (saved) historyData = JSON.parse(saved);
            apiKey = localStorage.getItem('gemini_api_key') || '';
        } catch(e) {
            historyData = [];
        }

        let currentImageData = null;

        const toggleSettings = document.getElementById('toggleSettings');
        const settingsCard = document.getElementById('settingsCard');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');

        const sceneInput = document.getElementById('sceneInput');
        const imageInput = document.getElementById('imageInput');
        const uploadText = document.getElementById('uploadText');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImgBtn = document.getElementById('removeImgBtn');
        const enhanceBtn = document.getElementById('enhanceBtn');
        const errorMsg = document.getElementById('errorMsg');
        const outputCard = document.getElementById('outputCard');
        const outputBox = document.getElementById('outputBox');
        const copyBtn = document.getElementById('copyBtn');
        const saveHistoryBtn = document.getElementById('saveHistoryBtn');
        const historyList = document.getElementById('historyList');

        if (apiKey) apiKeyInput.value = apiKey;

        toggleSettings.addEventListener('click', () => {
            settingsCard.style.display = settingsCard.style.display === 'none' ? 'flex' : 'none';
        });

        saveKeyBtn.addEventListener('click', () => {
            apiKey = apiKeyInput.value.trim();
            try {
                localStorage.setItem('gemini_api_key', apiKey);
            } catch(e) {}
            settingsCard.style.display = 'none';
            alert('تم حفظ المفتاح بنجاح!');
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentImageData = evt.target.result;
                    imagePreview.src = currentImageData;
                    previewContainer.style.display = 'block';
                    uploadText.parentElement.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        removeImgBtn.addEventListener('click', function() {
            currentImageData = null;
            imageInput.value = '';
            imagePreview.src = '';
            previewContainer.style.display = 'none';
            uploadText.parentElement.style.display = 'block';
        });

        enhanceBtn.addEventListener('click', async function() {
            const text = sceneInput.value.trim();
            errorMsg.style.display = 'none';

            if (!apiKey) {
                errorMsg.textContent = 'يرجى إدخال مفتاح Gemini API من إعدادات التطبيق (⚙️) أولاً.';
                errorMsg.style.display = 'block';
                settingsCard.style.display = 'flex';
                return;
            }

            if (!text && !currentImageData) {
                alert('الرجاء كتابة وصف المشهد أو إرفاق صورة أولاً.');
                return;
            }

            enhanceBtn.innerHTML = '<div class="loading"></div><span>جاري المعالجة بواسطة Gemini...</span>';
            enhanceBtn.disabled = true;

            try {
                let contents = [];
                let promptText = `Translate and enhance the following Arabic scene description into a single professional English cinematic video prompt of 2 to 3 sentences covering camera movement, lighting, and atmosphere. Return ONLY the English prompt without any extra introduction or markdown formatting.\n\nScene description: ${text}`;

                let parts = [{ text: promptText }];

                if (currentImageData) {
                    const base64Data = currentImageData.split(',')[1];
                    const mimeType = currentImageData.split(';')[0].split(':')[1];
                    parts.push({
                        inline_data: {
                            mime_type: mimeType,
                            data: base64Data
                        }
                    });
                }

                contents.push({ parts: parts });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                if (!response.ok) {
                    throw new Error(`خطأ في الاتصال بالخادم (${response.status})`);
                }

                const data = await response.json();
                const candidate = data.candidates?.[0];
                
                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                    throw new Error('لم يتم تلقي رد صحيح من النموذج.');
                }

                const resultText = candidate.content.parts[0].text.trim();

                outputBox.textContent = resultText;
                outputCard.style.display = 'flex';
                outputCard.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                errorMsg.textContent = 'فشل الاتصال بـ Gemini API: ' + (err.message || 'تأكد من صحة المفتاح واتصال الإنترنت.');
                errorMsg.style.display = 'block';
            } finally {
                enhanceBtn.innerHTML = '<span>حسّن الوصف بواسطة Gemini</span>';
                enhanceBtn.disabled = false;
            }
        });

        copyBtn.addEventListener('click', function() {
            navigator.clipboard.writeText(outputBox.textContent).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'تم النسخ!';
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            });
        });

        saveHistoryBtn.addEventListener('click', function() {
            const enhancedText = outputBox.textContent;
            if (!enhancedText) return;

            const newItem = {
                id: Date.now(),
                text: enhancedText,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            historyData.unshift(newItem);
            if (historyData.length > 15) historyData.pop();

            try {
                localStorage.setItem('video_studio_history_v3', JSON.stringify(historyData));
            } catch(e) {}

            renderHistory();
            saveHistoryBtn.textContent = 'تم الحفظ!';
            setTimeout(() => saveHistoryBtn.textContent = 'حفظ في السجل', 2000);
        });

        function renderHistory() {
            if (historyData.length === 0) {
                historyList.innerHTML = '<div style="color: var(--text-muted); text-align: center; font-size: 0.85rem; padding: 10px;">لا توجد محفوظات بعد</div>';
                return;
            }

            historyList.innerHTML = '';
            historyData.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.75rem;">
                        <span>${item.time}</span>
                    </div>
                    <div class="history-content">${item.text}</div>
                    <div class="history-actions">
                        <button class="small-btn" onclick="copyHistoryText('${item.text}', this)">نسخ</button>
                        <button class="small-btn danger" onclick="deleteHistoryItem(${item.id})">حذف</button>
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        window.copyHistoryText = function(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btnElement.textContent;
                btnElement.textContent = 'تم!';
                setTimeout(() => btnElement.textContent = orig, 1500);
            });
        };

        window.deleteHistoryItem = function(id) {
            historyData = historyData.filter(item => item.id !== id);
            try {
                localStorage.setItem('video_studio_history_v3', JSON.stringify(historyData));
            } catch(e) {}
            renderHistory();
        };

        renderHistory();
    </script>
